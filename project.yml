name: WeldSettings
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  WeldSettings:
    type: application
    platform: iOS
    sources:
      - path: WeldSettings
      - path: Shared
    dependencies:
      - target: WeldSettingsWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weld-settings
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: WeldSettings/WeldSettings.entitlements
    info:
      path: WeldSettings/Info.plist
      properties:
        CFBundleDisplayName: Weld Settings
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo of the finished bead to keep with the weld you are logging.
        NSPhotoLibraryUsageDescription: Choose a photo of a bead or a joint to keep with the weld you are logging.
        ITSAppUsesNonExemptEncryption: false
  WeldSettingsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WeldSettingsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weld-settings.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: WeldSettingsWidget/WeldSettingsWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: WeldSettingsWidget/Info.plist
      properties:
        CFBundleDisplayName: Weld Settings Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  WeldSettingsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeldSettingsTests
    dependencies:
      - target: WeldSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weld-settings.tests
        GENERATE_INFOPLIST_FILE: YES
  WeldSettingsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeldSettingsUITests
    dependencies:
      - target: WeldSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.weld-settings.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WeldSettings
schemes:
  WeldSettings:
    build:
      targets:
        WeldSettings: all
        WeldSettingsTests: [test]
        WeldSettingsUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: WeldSettings/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: WeldSettings/StoreKit/Products.storekit
      targets:
        - WeldSettingsTests
        - WeldSettingsUITests
    archive:
      config: Release
